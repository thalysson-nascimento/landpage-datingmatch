<div class="create-account-wrapper">
  <form class="create-account-form" id="createAccountForm">
    <!-- NAME -->
    <div class="form-group">
      <label for="name" class="form-label"> Seu nome </label>

      <input type="text" id="name" class="form-input" placeholder="Nome" />
    </div>

    <!-- EMAIL -->
    <div class="form-group">
      <label for="email" class="form-label"> Seu email </label>

      <input type="email" id="email" class="form-input" placeholder="Email" />
    </div>

    <!-- PASSWORD -->
    <div class="form-group">
      <label for="password" class="form-label"> Sua senha </label>

      <input
        type="password"
        id="password"
        class="form-input"
        placeholder="Password"
      />
    </div>

    <!-- BUTTON -->
    <button
      type="submit"
      class="create-account-button"
      id="createAccountButton"
      disabled
    >
      Quero fazer o meu cadastro
    </button>

    <!-- TERMS -->
    <p class="create-account-terms">
      Ao se cadastrar, você concorda em receber e-mails do DatingMatch e
      aceitando as nossas Políticas de Privacidade.
    </p>
  </form>
</div>

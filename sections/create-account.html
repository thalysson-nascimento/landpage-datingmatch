<div class="create-account-wrapper">
  <form class="create-account-form" id="createAccountForm">
    <!-- NAME -->
    <div class="form-group">
      <label for="name" class="form-label"> Your name </label>

      <input type="text" id="name" class="form-input" placeholder="Name" />
    </div>

    <!-- EMAIL -->
    <div class="form-group">
      <label for="email" class="form-label"> Your email </label>

      <input type="email" id="email" class="form-input" placeholder="Email" />
    </div>

    <!-- PASSWORD -->
    <div class="form-group">
      <label for="password" class="form-label"> Your password </label>

      <input
        type="password"
        id="password"
        class="form-input"
        placeholder="Password"
      />
    </div>

    <!-- BUTTON -->
    <button
      type="submit"
      class="create-account-button"
      id="createAccountButton"
      disabled
    >
      Create my account
    </button>

    <!-- TERMS -->
    <p class="create-account-terms">
      By signing up, you agree to receive emails from DatingMatch and accept our
      Privacy Policy.
    </p>
  </form>
</div>
